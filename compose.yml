services:
  database:
    image: postgres:16-alpine
    container_name: barberbook_database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - barberbook_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  barberbook_postgres_data:
